[pytest]
# Sprint 1 (2026-08-23): явно фиксируем default loop scope, чтобы убрать
# PytestDeprecationWarning от pytest-asyncio и стабилизировать async-fixtures.
# function совместим с текущими тестами, которые создают свой event loop
# внутри (FastAPI TestClient и sync harness). Никакие async-fixtures
# в этом suite пока не зависят от module/session scope.
asyncio_default_fixture_loop_scope = function

# Sprint continuation (2026-08-23, T1.3a):
# Filterwarnings применяется ТОЛЬКО к upstream-package deprecation,
# которые мы не контролируем в этой ветке. Наш собственный шум
# (jose.utcnow) был закрыт в commit e66e7c9 (invites+v2+auth →
# datetime.now(timezone.utc)). Что остаётся в jose — это upstream
# python-jose/jwt.py:311, НЕ наш код. Filter приемлем.
#   - passlib.crypt: Python stdlib crypt (PEP 594), passlib ещё
#     не мигрировал. Наш код использует passlib только для legacy
#     user hashing (seed). Замена на bcrypt-direct/argon2 — P2.
#   - sqlalchemy default datetime adapter: SQLite3 3.12 upstream.
#   - jose.jwt: upstream python-jose — единственный путь
#     обновления это PR в python-jose. Наш слой не использует
#     jose.utcnow напрямую (security.py использует now(tz=utc)).
filterwarnings =
    ignore::DeprecationWarning:passlib.utils
    ignore::DeprecationWarning:sqlalchemy.engine.default
    ignore::DeprecationWarning:sqlalchemy.dialects.sqlite
    ignore::DeprecationWarning:jose.jwt

markers =
    slow: tests that may load local ML models or exercise expensive retrieval paths
    timeout(seconds): expected maximum duration for a test
