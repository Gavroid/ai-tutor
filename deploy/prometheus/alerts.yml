groups:
  - name: ai_tutor_health
    interval: 30s
    rules:
      - alert: AiTutorBackendDown
        expr: up{job="ai-tutor-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AI-Tutor backend metrics target is down"
          description: "Prometheus cannot scrape backend:8000/metrics. Check backend container and /ready."

      - alert: AiTutorBackend5xx
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AI-Tutor backend returns HTTP 5xx"
          description: "Server errors were observed during the last 5 minutes. Check backend logs and admin Realtime."

      - alert: AiTutorUnexpected4xxSpike
        expr: sum(rate(http_requests_total{status=~"4..", path!="/api/v1/student/topics/{topic_id}/draft", path!="/api/v1/admin/realtime/snapshot"}[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Unexpected AI-Tutor 4xx spike"
          description: "Unexpected client errors are above threshold. Expected draft 404 and unauthenticated snapshot probes are excluded."

      - alert: AiTutorLoginRateLimitSpike
        expr: sum(rate(http_requests_total{status="429", path="/api/v1/auth/login"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Login rate-limit spike"
          description: "Repeated login attempts are hitting 429. Check for user lockout or brute-force noise."

      - alert: AiTutorReadyProbeFailing
        expr: sum(rate(http_requests_total{path="/ready", status!="200"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AI-Tutor readiness failures"
          description: "/ready returned non-200 recently. Check DB connectivity and backend startup."

      - alert: AiTutorDatabaseProbeDown
        expr: max(ai_tutor_db_up) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AI-Tutor DB probe is failing"
          description: "Backend /metrics cannot run SELECT 1 against the database. /ready should also be checked."

      - alert: AiTutorRedisProbeDown
        expr: max(ai_tutor_redis_up) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AI-Tutor Redis probe is failing"
          description: "Backend /metrics cannot ping Redis. Rate-limit, budget and readiness state may be unsafe."

      - alert: AiTutorUploadDiskHigh
        expr: max(ai_tutor_upload_disk_used_percent) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AI-Tutor upload filesystem disk usage is high"
          description: "Uploads/backup filesystem is above 80 percent used. Clean old artifacts or expand storage."

      - alert: AiTutorBackupMissingOrStale
        expr: max(ai_tutor_backup_latest_age_seconds) < 0 or max(ai_tutor_backup_latest_age_seconds) > 93600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "AI-Tutor latest backup is missing or older than 26 hours"
          description: "Backend metrics cannot see a recent backup manifest. Check backup cron and offsite job."
