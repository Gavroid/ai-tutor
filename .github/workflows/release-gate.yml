name: Release Gate

# Sprint 3.7 / S7 release gate.
# Цель: блокировать merge в main, если что-то из критичного сломано.
# Три проверки в параллель (для скорости ~6 мин):
#   1) backend unit tests (pytest, 1340+ тестов)
#   2) frontend build (tsc + next build)
#   3) production smoke (ssh → smoke.sh на проде) — ловит регрессии
#      которые pytest не видит (alembic drift, env differences).
#
# Триггеры:
#   - push в main          (пост-мерж контроль)
#   - pull_request в main  (блокирует merge если красный)
#
# Использование:
#   - Branch protection на main: required status check "Release Gate / gate".
#     Иначе workflow запускается, но merge не блокируется.
#
# Защита от утечки секретов:
#   - В логах curl c -k, заголовки авторизации НЕ пишутся в echo.
#   - SMOKE_PASS приходит через secret, в env step'а, не в cmdline.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Один одновременный запуск на ветку — новые коммиты отменяют старые.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

# Минимальные права: чтение репы + проверка статуса.
permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false  # пусть все три проверки отработают, даже если одна падает
      matrix:
        include:
          - name: backend-tests
            runs-on: ubuntu-latest
            command: backend
          - name: frontend-build
            runs-on: ubuntu-latest
            command: frontend
          - name: prod-smoke
            runs-on: [self-hosted, linux, x64, prod]
            command: smoke

    steps:
      - uses: actions/checkout@v4

      - name: Run backend pytest
        if: matrix.command == 'backend'
        working-directory: apps/backend
        env:
          AI_API_KEY: "mock-key-for-ci"
          UPLOAD_DIR: "/tmp/ai-tutor-test-uploads"
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -q -r requirements.txt -r requirements-dev.txt
          # Sprint 3.15: test_mapping_quality_audit удалён (модуль scripts/mapping_quality_audit не существует).
          pytest --tb=short -q

      - name: Run frontend tsc + build + lint
        if: matrix.command == 'frontend'
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: "https://example.com/api"
        run: |
          set -e
          npm ci
          npx tsc --noEmit
          # Sprint 3.24: lint — гейт качества. --max-warnings 45 = baseline
          # зафиксирован в Sprint 3.24. Уменьшаем по мере чистки legacy.
          npm run lint
          NEXT_TELEMETRY_DISABLED=1 npm run build

      # Прогоняет production smoke.sh на проде (через self-hosted runner).
      # Требует secret PRODUCTION_SSH_KEY и PRODUCTION_SSH_USER (см. README ниже).
      - name: Run production smoke against prod
        if: matrix.command == 'smoke'
        env:
          SMOKE_USER: "admin@example.com"
          SMOKE_PASS: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
          PROD_HOST: "192.168.1.86"
        run: |
          set -e
          log() { printf '\033[1;34m[gate-smoke]\033[0m %s\n' "$*"; }
          fail() { printf '\033[1;31m[gate-smoke FAIL]\033[0m %s\n' "$*"; exit 1; }
          log "Running smoke.sh against prod (${PROD_HOST})..."
          # smoke.sh на runner'е — копируем из репо.
          chmod +x deploy/release/smoke.sh
          bash deploy/release/smoke.sh

# === Как включить ===
#
# 1. Добавить в GitHub Secrets (Settings → Secrets and variables → Actions):
#    - PRODUCTION_SMOKE_PASSWORD  — пароль admin@example.com на проде.
#      (сменить через скрипт reset-admin-password и положить сюда)
#
# 2. Включить self-hosted runner на проде (Kirill-AI, 192.168.1.86)
#    с labels: self-hosted, linux, x64, prod. Уже есть для deploy.yml.
#
# 3. GitHub Settings → Branches → Branch protection rules → main:
#    ✅ Require status checks to pass before merging
#    ✅ Require branches to be up to date before merging
#    В списке status checks выбрать "Release Gate / gate" (появится после
#    первого запуска workflow).
#
# 4. Опционально: Required reviewers = 1 (Кирилл).
